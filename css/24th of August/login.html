<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <img src="img.png" alt="" class="logo">

        <div class="language">
            Language: <span>English (United States)</span><i class="arrow"></i>
        </div>
    </header>
  <main class="main">
        <div class="login-card">
            <div class="card-title">
                Go54 Cloud Email
            </div>

            <div class="form-container">
                <h2 class="sign-in-title">Sign in</h2>

                <form>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-group password-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>

                    <div class="remember">
                        <input type="checkbox" id="stay-signed-in" checked>
                        <label for="stay-signed-in">Stay signed in</label>
                    </div>

                    <button type="submit" class="sign-in-button">
                        Sign in
                    </button>
                </form>
            </div>
        </div>
    </main>
    <footer class="footer">
        <span class="version">Version: 8.51.3</span>
        <a href="#">Privacy policy</a>
        <a href="#">Legal notes</a>
    </footer>
</body>
</html>
