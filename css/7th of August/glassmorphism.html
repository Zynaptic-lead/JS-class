<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: url(food-collegee.png);
    }
    .glass-card{
        width: 320px;
        padding: 40px;
        border-radius: 16px;
        color: #fff;
        text-align:center;
        background-color: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border:2px solid rgba(255, 2552, 255, 0.25);
    }
    .glass-card h2{
        margin-bottom: 10px;
        font-size: 24px;
    }
    .glass-card p{
        font-size: 14px;
        opacity: 0.9;
    }
</style>
<body>
    <div class="glass-card">
        <h2>Glassmorphism</h2>
        <p>This is a simple glassmoprhism card</p>
    </div>
</body>
</html>
