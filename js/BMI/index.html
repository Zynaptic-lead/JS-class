<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="index.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="container">
    <h1>Bmi Calculator</h1>
    <p class="description">Selcect your preferred measuring unit</p>
  <div class="unit-box">
    <button id="metricBtn" class="active" onclick="selectUnit('matric')">Metric <br> kg / cm</button>
    <button id="imperialBtn" onclick="selectUnit('imperial')">Imperial <br> lib / inches</button>
  </div>
  <label id="weightLabel">Weight (kg)</label>
  <input type="number" id="weight"
  placeholder="Enter a number">
  <label id="heightLabel">Height</label>
  <input type="number" id="height"
  placeholder="Enter a number">

  <button class="calculate-btn" onclick="calculateBMi()">Calculate BMI</button>
  <div id="result"></div>
  </div>
</body>
</html>
